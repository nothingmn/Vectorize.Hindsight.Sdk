name: build

# The gate every change passes through. It is deliberately thorough: this repository's
# risk is not compile errors (those are loud) but the quiet divergences — a generated
# file drifting from the pinned specification, a package that packs but is unusable, a
# coverage floor that silently stops applying.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant. Cancelling it frees
# the runner rather than letting a superseded build finish and report a stale result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true
  # Read by Directory.Build.props to enable ContinuousIntegrationBuild and to reference
  # SourceLink. Set explicitly rather than relying on the implicit variable, so a local
  # run with these vars reproduces CI exactly.
  GITHUB_ACTIONS: true

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is required, not cosmetic: SourceLink embeds the commit into the
      # symbol package, and a shallow clone has no commit to read. Without it the source
      # link is empty and the symbol package resolves to nothing.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------------------------------
      # Decide the version before anything else.
      #
      # One place declares it: VersionPrefix in Directory.Build.props. Everything
      # else is derived here — the commit hash as the final segment — so a
      # workflow cannot disagree with the build about what was produced.
      #
      # The hash is a pre-release identifier, not a fourth numeric segment,
      # because that is the only form NuGet accepts. `dotnet pack` rejects
      # `0.1.0.abc123456` outright (the fourth segment must be numeric and fits
      # in 16 bits) and strips `+build` metadata from the package identity. See
      # the header of eng/package_version.py for the three probes behind this.
      # ---------------------------------------------------------------------
      - name: Determine the version
        id: version
        run: |
          VERSION="$(python3 eng/package_version.py)"
          PREFIX="$(python3 eng/package_version.py --prefix)"
          SHA="$(python3 eng/package_version.py --sha)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"         >> "$GITHUB_OUTPUT"

          echo "Declared prefix : $PREFIX"
          echo "Commit          : $SHA"
          echo "Build version   : $VERSION"

          # A tagged commit produces the bare release; anything else is a
          # pre-release candidate carrying the hash. Both are derived, never
          # typed, which is what keeps the tag and the package in agreement.

      # ---------------------------------------------------------------------
      # Static checks first: the workflow files themselves, then the generated
      # code. A stale generated file is reported as drift rather than as whatever
      # confusing compile error it happens to produce against the new model shapes.
      # ---------------------------------------------------------------------

      # The workflows are the one thing here that only fails on GitHub. Everything
      # checkable without a runner is checked before anything expensive runs.
      - name: Validate the workflow definitions
        run: python3 eng/validate_workflows.py

      - name: Verify the generated models match the spec
        run: python3 eng/generate_models.py --check

      - name: Verify the generated operations match the spec
        run: python3 eng/generate_operations.py --check

      - name: Verify the committed inventory matches the spec
        run: python3 eng/generate_inventory.py --check

      # ---------------------------------------------------------------------
      # Build and test.
      # ---------------------------------------------------------------------

      - name: Restore
        run: dotnet restore Vectorize.Hindsight.Sdk.slnx

      - name: Build
        run: dotnet build Vectorize.Hindsight.Sdk.slnx --configuration Release --no-restore
             -p:Version=${{ steps.version.outputs.version }}

      # The integration suite skips itself when no server is present, stating the reason
      # rather than failing. The unit suites need neither network nor credentials.
      - name: Test
        run: dotnet test Vectorize.Hindsight.Sdk.slnx --configuration Release --no-build
             --collect:"XPlat Code Coverage"
             --results-directory ./artifacts/test-results
             --logger "trx"

      - name: Check coverage floors
        run: python3 eng/coverage_gate.py './artifacts/test-results/**/coverage.cobertura.xml'

      # ---------------------------------------------------------------------
      # Package, then verify what was produced.
      # ---------------------------------------------------------------------

      # dotnet pack writes into the output directory rather than replacing it, so a stale
      # package from an earlier version would survive alongside the current one and be read
      # by the verification below. A fresh runner has no such directory; this keeps the
      # invariant true regardless.
      - name: Pack
        run: |
          rm -rf ./artifacts/packages
          mkdir -p ./artifacts/packages
          dotnet pack Vectorize.Hindsight.Sdk.slnx --configuration Release --no-build \
            --output ./artifacts/packages \
            -p:Version=${{ steps.version.outputs.version }}

      # Packing can succeed while producing the wrong version — if a project set
      # <Version> itself, or if -p:Version was not applied for some reason. The
      # archive name is not evidence; this opens it and reads the identity inside.
      - name: Verify the produced packages carry the derived version
        run: python3 eng/verify_packages.py ./artifacts/packages --expect-version "${{ steps.version.outputs.version }}"

      - name: Verify the derived version is reproducible
        run: |
          # The version the workflow used must equal the version the source
          # declares for this commit. If these ever disagree, an artifact has
          # been built that does not identify the code inside it.
          EXPECTED="${{ steps.version.outputs.version }}"
          RECOMPUTED="$(python3 eng/package_version.py)"
          if [[ "$EXPECTED" != "$RECOMPUTED" ]]; then
            echo "::error::the build used $EXPECTED but the source now derives $RECOMPUTED."
            exit 1
          fi

          # And the hash segment must really be this commit's, not a stale value.
          SHA="$(python3 eng/package_version.py --sha)"
          if [[ "${GITHUB_SHA:0:9}" != "$SHA" ]]; then
            echo "::error::version hash segment $SHA does not match GITHUB_SHA ${GITHUB_SHA:0:9}."
            exit 1
          fi

          echo "Verified: $EXPECTED carries ${GITHUB_SHA:0:9}."

      # Neither `dotnet pack` nor the check above proves the archive can be *restored and
      # called*. This consumes the packages from a local feed in a throwaway project, so a
      # missing dependency, a broken lib/ payload, or an unsatisfiable sibling version fails
      # here rather than in someone else's restore.
      - name: Consume the packages from a local feed
        run: bash eng/consume_package.sh ./artifacts/packages

      # ---------------------------------------------------------------------
      # Report and upload.
      # ---------------------------------------------------------------------

      - name: Summarise
        run: |
          {
            echo "### Build result"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$(python3 eng/package_version.py)\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "### Coverage"
            echo ""
            echo '```'
            python3 eng/coverage_gate.py './artifacts/test-results/**/coverage.cobertura.xml' 2>&1 | tail -12
            echo '```'
            echo ""
            echo "### Packages"
            echo ""
            echo '```'
            ls -la ./artifacts/packages
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
          # A build that produced no package has failed, even if it exited zero.
          if-no-files-found: error
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 30
